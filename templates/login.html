<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Grand Stay Hotel</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

<nav class="navbar">

    <div class="logo">
        🏨 Grand Stay
    </div>

    <div class="nav-links">
        <a href="/">Home</a>
        <a href="/rooms">Rooms</a>
        <a href="/register">Register</a>
        <a href="/login">Login</a>
    </div>

</nav>

<div class="form-container">

    <div class="form-box">

        <h1>Customer Login</h1>

        <p>Login to continue.</p>

        <form method="POST">

            <label>Email</label>

            <input
                type="email"
                name="email"
                placeholder="Enter your email"
                required
            >

            <label>Password</label>

            <input
                type="password"
                name="password"
                placeholder="Enter your password"
                required
            >

            <button type="submit" class="submit-btn">
                Login
            </button>

        </form>

        <p class="login-text">
            Don't have an account?
            <a href="/register">Register here</a>
        </p>

    </div>

</div>

<footer>
    <p>
        © 2026 Grand Stay Hotel | Online Hotel Management System
    </p>
</footer>

</body>
</html>
